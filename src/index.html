<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<link href="./assets/output.css" rel="stylesheet">
</head>
<body class="bg-yellow-200">


    <div class="p-10 m-4 bg-red-300 size-[50%] mt-[6vw] ml-[25vw] rounded-md">
        <div class="p-5 w-5x1 h-30 bg-black rounded-sm">
            <p class="text-yellow-100 flex justify-end items-center size-[100%] text-[5vh]" id="factor-1">0</p>
        </div>
            <div class="bg-violet-400 mt-15 grid grid-cols-4 gap-x-30 gap-y-15 p-10">

                <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class="size-full flex justify-center items-center m-0 p-0 p-0 m-0">1</p></div>

                <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]" id="btn-2"><p class="size-full flex justify-center items-center m-0 p-0">2</p></div>

                <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class="size-full flex justify-center items-center m-0 p-0">3</p></div>

                <div class="operator p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class="size-full flex justify-center items-center m-0 p-0">+</p></div>

                <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class="size-full flex justify-center items-center m-0 p-0">4</p></div>

                <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class="size-full flex justify-center items-center m-0 p-0">5</p></div>

                <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class="size-full flex justify-center items-center m-0 p-0">6</p></div>

                <div class="operator p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class="size-full flex justify-center items-center m-0 p-0">-</p></div>

                 <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class="size-full flex justify-center items-center m-0 p-0">7</p></div>

                 <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class=" size-full flex justify-center items-center m-0 p-0">8</p></div>

                 <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class=" size-full flex justify-center items-center m-0 p-0">9</p></div>

                 <div class="operator p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class=" size-full flex justify-center items-center m-0 p-0">X</p></div>

                 <div class="btn-number p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class=" size-full flex justify-center items-center m-0 p-0">0</p></div>

                <div class="p-5 bg-violet-200 hover:bg-red-500 hover:text-white  flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]" id="clear"><p class="size-full flex justify-center items-center m-0 p-0">C</p></div>

                <div class="operator p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]"><p class="size-full flex justify-center items-center m-0 p-0">/</p></div>

                <div class="p-5 bg-violet-200 hover:bg-violet-700 hover:text-white flex justify-center items-center border-2 border-solid border-purple-600 rounded-[3vh] text-[1.5vw]" id="equals"><p class="size-full flex justify-center items-center m-0 p-0">=</p></div>
            </div>
    </div>

<script src="script.js"></script>
</body>
</html>
